info:
  title: API de Marmoraria
  description: Documentação da API para gerenciamento de marmoraria, incluindo usuários, acabamentos, materiais, produtos, projetos e orçamentos.
  version: 1.0.0
servers:
  - url: http://localhost:5000/api
    description: URL local de desenvolvimento
paths:
  /users/create:
    post:
      summary: Cria um novo usuário
      requestBody:
        description: Dados do novo usuário
        content:
          application/json:
            schema:
              type: object
              properties:
                nome:
                  type: string
                email:
                  type: string
                senha:
                  type: string
                admin:
                  type: boolean
                  default: false
              required:
                - nome
                - senha
      responses:
        '201':
          description: Usuário criado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /users/login:
    post:
      summary: Faz login de um usuário
      requestBody:
        description: Dados de login do usuário
        content:
          application/json:
            schema:
              type: object
              properties:
                nome:
                  type: string
                senha:
                  type: string
              required:
                - nome
                - senha
      responses:
        '200':
          description: Login realizado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /users/logout:
    post:
      summary: Faz logout de um usuário
      responses:
        '200':
          description: Logout realizado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          description: Autenticação necessária
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /users/list:
    get:
      summary: Lista todos os usuários
      responses:
        '200':
          description: Lista de usuários
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    nome:
                      type: string
                    email:
                      type: string
                    admin:
                      type: boolean
        '401':
          description: Autenticação necessária
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /users/{user_id}:
    put:
      summary: Atualiza um usuário existente
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        description: Dados para atualizar o usuário
        content:
          application/json:
            schema:
              type: object
              properties:
                nome:
                  type: string
                email:
                  type: string
                senha:
                  type: string
                admin:
                  type: boolean
      responses:
        '200':
          description: Usuário atualizado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: Usuário não encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /users/{user_id}:
    delete:
      summary: Deleta um usuário
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Usuário deletado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '403':
          description: Permissão negada
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: Usuário não encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
